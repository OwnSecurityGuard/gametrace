# http-decoder — HTTP/1.1 解码插件清单与语义契约声明
#
# 解码 examples/http 的 client<->server 流量：HTTP 请求/响应 + JSON 信封
#   {"header":{"cmd":<message id>},"body":{"seq":<correlation>,"error_code":<error>}}
# 语义字段与 examples/http 的 client/main.go、server/main.go 保持一致，
# 覆盖 message id / request-response role / seq correlation / push rule / error 五类格式。
#
# 协议语义通过 semantic_rules 声明（插件定义语义、平台执行）：
#   - http.pair_request_response：请求/响应按 body.seq 回显配对
#   - http.mark_push：cmd==2001 或 seq==0 的推送消息标注为 notification
#   - http.mark_error：error_code!=0 标注为 error
# schema / states 声明层在 v0.9.0 已移除，不再声明。

api_version: gt.decoder/v2
name: http-decoder
protocol: http
protocol_version: "1.1"
type: decoder
transports:
  - tcp
hints:
  - http
  - json
  - tcp
  - port:8984
capabilities:
  decode: true
contract:
  name: gt.plugin
  version: 1
semantic_rules:
  # 请求/响应配对：服务端回显请求的 seq，两侧键都取自 payload 的 seq。
  # seq==0 是推送消息，由 when 拦截不参与配对。方向角色走 _meta.direction
  # （平台把 Meta 通道并入规则求值视图的 _meta 键）。
  - id: http.pair_request_response
    when:
      - { path: seq, op: neq, value: 0 }
    effect:
      type: pair
      sides:
        - { path: _meta.direction, op: eq, value: client_to_server, key: seq }
        - { path: _meta.direction, op: eq, value: server_to_client, key: seq }
  # 推送消息：命中 push rule（cmd==2001 或 body.seq==0），标注为 notification。
  - id: http.mark_push
    when:
      any:
        - { path: seq, op: eq, value: 0 }
        - { path: cmd, op: eq, value: 2001 }
    effect:
      type: annotate
      semantic: notification
  # 错误语义：error_code != 0，标注为 error。
  - id: http.mark_error
    when:
      - { path: error_code, op: neq, value: 0 }
    effect:
      type: annotate
      semantic: error
meta:
  author: opencode
  description: >-
    HTTP/1.1 decoder for the examples/http client<->server traffic. Reassembles
    the per-flow TCP stream (framing.ExtractL7 + Reassembler), parses HTTP
    requests and responses, and extracts the JSON envelope semantics
    (header.cmd / body.seq / body.error_code) to cover the five semantic
    formats: message id, request/response role, seq correlation, push rule and
    error. Protocol semantics are declared as semantic_rules (pair by seq,
    annotate push/error) and executed by the platform. Body text is captured
    up to 64KB with a body_truncated flag.
  game: http-demo
  transport: http-json
  decoded_directions: [client_to_server, server_to_client]
