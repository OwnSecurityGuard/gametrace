# wesnoth-decoder — Battle for Wesnoth 客户端 <-> wesnothd 流量解码插件
#
# 协议真源（wesnoth 源码）：
#   src/network_asio.cpp              （客户端握手 / 帧格式 / 收发）
#   src/server/common/server_base.cpp （服务端握手 / 收发）
#   src/server/common/simple_wml.cpp  （WML 文本语法与 gzip/bzip2 压缩）
#   src/server/wesnothd/server.cpp    （消息分发，顶层 tag 枚举）
#
# 线格式：
#   TCP :15000。连接建立时客户端发 4 字节大端握手（0=明文 / 1=请求 TLS），
#   服务端回 4 字节（0x00000000=接受 / 0xFFFFFFFF=拒绝 TLS）。
#   之后每条消息 = [4 字节大端长度 N][N 字节 payload]；payload 是 gzip 或
#   bzip2 压缩的 WML 文本（首字节 'B' 为 bzip2，否则 gzip）。
#   WML 文本：根无 tag，属性 key=value 或 key="value" 每行，子节点
#   [tag]...[/tag] 递归嵌套；消息类型 = 根的首个子 tag 名。
#
# 事件载荷：消息节点（根首个子 tag）的属性扁平到顶层，嵌套子节点按 tag 名
# 分组放入 _children；msg_type 承载消息类型（判别字段），_raw 保留 WML 原文。

api_version: gt.decoder/v2
name: wesnoth-decoder
protocol: wesnoth
protocol_version: "1.18"
type: decoder
hints:
  - tcp
  - wml
  - gzip
  - length-prefixed
  - port:15000
  - wesnoth
# === 能力位（spec v3 §6）：声明 decode + schema ===
capabilities:
  decode: true
  schema: true
# === 语义契约版本块（spec v3 §3）===
contract:
  name: gta.plugin
  version: 1
# === schema 声明（宿主 ToSchemaRegistry 实际消费此段）===
# 消息类型异构（version/login/gamelist/chat/turn/...），属性集合不定，
# 故采用单个宽松的通用 schema：strict:false，业务字段即消息节点的属性。
schemas:
  - id: wesnoth.message
    version: 1
    name: Wesnoth WML message
    description: >-
      一条 Wesnoth 网络消息。业务载荷 = 消息节点（根首个子 tag）的属性扁平化到
      顶层（全部为字符串值）+ 嵌套子节点（_children，按 tag 名分组为数组）。
      消息类型由 msg_type 承载，宿主经 name 语义规则写入 meta.msg_name。
    strict: false
    fields:
      msg_type:
        type: string
        queryable: true
        description: 消息类型（根节点首个子 tag 名，如 version/login/chat/gamelist）。
      _children:
        type: object
        optional: true
        description: 嵌套子节点，按 tag 名分组为数组（结构递归同顶层）。
      _raw:
        type: string
        optional: true
        description: 解压后的 WML 原文（截断至 8KB），用于人工核对协议细节。
# === 语义规则（Protocol Semantic Rule，spec：插件声明、平台执行）===
# GJSON path 基于 decoder 产出的事件 payload：业务字段在顶层（含 msg_type），
# 方向在 _meta（宿主保留 _meta 不剔除）。
semantic_rules:
  # name：消息名称从 payload 的 msg_type 字段提取（替代解码器硬编码），
  # 宿主写入 meta.msg_name；同事件内后续 pair/annotate 规则可按 _meta.msg_name 判定。
  - id: wesnoth.name_msg
    when:
      - path: msg_type
        op: exists
    effect:
      type: name
      key: msg_type
  # annotate：消息角色标注（request/response/notification）。
  # 角色清单取自 wesnothd 消息分发（src/server/wesnothd/server.cpp）：
  # 客户端主动发起的动作 / 请求 vs 服务端应答 / 被动通知。
  - id: wesnoth.annotate_request
    when:
      - path: _meta.msg_name
        op: in
        value: [version, login, refresh_lobby, create_game, join, join_server_queue, leave_server_queue, game_history_request, snapshot, scenario, store_next_scenario, multiplayer, era, turn, request, ping, init_side]
    effect: { type: annotate, semantic: request }
  - id: wesnoth.annotate_response
    when:
      - path: _meta.msg_name
        op: in
        value: [error, redirect, reject]
    effect: { type: annotate, semantic: response }
  - id: wesnoth.annotate_notification
    when:
      - path: _meta.msg_name
        op: in
        value: [gamelist, user, game, message, whisper, query, nickserv, chat, side, unit, leader, modification, addon, content, command, surrender, diff, change_child, insert_child, delete_child, turn]
    effect: { type: annotate, semantic: notification }
meta:
  author: workbuddy
  description: >-
    Decoder for Battle for Wesnoth client <-> wesnothd traffic on :15000.
    Plain TCP. Each message is [4-byte big-endian length][payload], the payload
    is gzip- or bzip2-compressed simple_wml text (a leading 'B' selects bzip2).
    The WML root carries no tag; the first child tag of the root is the message
    type (version/login/gamelist/chat/turn/...). Each direction of a connection
    opens with a 4-byte big-endian handshake (client: 0=plain/1=TLS request;
    server replies 0 or 0xFFFFFFFF), which the decoder detects and skips.
    Uses framing.ExtractL7 + Reassembler so messages spanning several TCP
    segments survive; direction is derived from the wesnothd port (15000).
    Message attributes are flattened to the event top-level; nested children
    are grouped under _children, and msg_type carries the message type.
  game: wesnoth
  transport: tcp-wml-gzip
  decoded_directions: [client_to_server, server_to_client]
